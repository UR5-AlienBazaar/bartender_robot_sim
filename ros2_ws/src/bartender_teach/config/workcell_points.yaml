pipelines:
  grab_jager:
    steps:
    - gripper: home
      note: 'gripper empty: find its closed stop'
    - grip: 0.02
      arm: a
      note: open
    - goto: aproach_jager
      note: in front of the jager bottle
    - movel: grab_jager
      note: straight in around the bottle
    - grip: 0.5
      arm: a
      note: close until it grips
    - movel: up_jager
      note: lift straight up
    - movel: back_jager
      note: pull back, bottle upright
    recorded: '2026-09-27T15:25:30'
    note: home the gripper, pick up the jager bottle and pull it back
  grab_vodka:
    steps:
    - goto: approach_grab_vodka
    - grip: 0.02
      arm: a
    - goto: grab_vodka
    - grip: 0.5
      arm: a
    - goto: up_vodka
    - goto: away_up_vodka
    recorded: '2026-09-25T20:36:22'
    note: grab_whiskey shifted 130 mm along tool +y
  grab_whiskey:
    steps:
    - gripper: home
      note: 'gripper empty: find its closed stop'
    - grip: 0.02
      arm: a
      note: open
    - goto: aproach_whiskey
      note: in front of the whiskey bottle
    - movel: grab_whiskey
      note: straight in around the bottle
    - grip: 0.5
      arm: a
      note: close until it grips
    - movel: up_whiskey
      note: lift straight up
    - movel: back_whiskey
      note: pull back, bottle upright
    recorded: '2026-09-27T15:25:30'
    note: home the gripper, pick up the whiskey bottle and pull it back
  pour_jager:
    steps:
    - movej: glass
      note: bottle upright, spout over the glass
    - movel: glass_tilt_15
      note: 'tilt about the bottle TCP (workcell_bottle): the spout stays put'
    - movel: glass_tilt_30
    - movel: glass_tilt_45
    - movel: glass_tilt_60
    - movel: glass_tilt_75
    - movel: glass_tilt_90
    - wait: 3.0
      note: 'pouring: this sets the amount'
    - movel: glass_tilt_75
    - movel: glass_tilt_60
    - movel: glass_tilt_45
    - movel: glass_tilt_30
    - movel: glass_tilt_15
    - movel: glass
      note: upright again, still holding the bottle
    recorded: '2026-09-27T15:25:30'
    note: 'after grab_jager: to the glass, roll +90 deg about tool +z around the bottle TCP (neck to the
      right seen from the robot), pour, roll back'
  pour_vodka:
