    - movel: pour_vodka_75
    - movel: pour_vodka_60
    - movel: pour_vodka_45
    - movel: pour_vodka_30
    - movel: pour_vodka_15
    - movel: pour
      note: upright again
    recorded: '2026-09-26T15:09:32'
    note: tilt +90 deg about base +x around the vodka spout, pour, tilt back
